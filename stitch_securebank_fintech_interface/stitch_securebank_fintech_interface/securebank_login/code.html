<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | SecureBank</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#adc7f7",
                        "surface-container-low": "#f1f4f6",
                        "primary-container": "#1a365d",
                        "on-primary-fixed": "#001b3c",
                        "inverse-on-surface": "#eef1f3",
                        "outline": "#74777f",
                        "on-tertiary-fixed-variant": "#3d4759",
                        "on-secondary-fixed": "#00201f",
                        "on-surface-variant": "#43474e",
                        "surface-variant": "#e0e3e5",
                        "primary": "#002045",
                        "surface-container": "#ebeef0",
                        "secondary-container": "#91f0ed",
                        "on-background": "#181c1e",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#bdc7dc",
                        "surface-bright": "#f7fafc",
                        "on-error-container": "#93000a",
                        "tertiary": "#172131",
                        "on-primary-container": "#86a0cd",
                        "primary-fixed-dim": "#adc7f7",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#121c2c",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#959fb3",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c4c6cf",
                        "surface": "#f7fafc",
                        "on-secondary-container": "#006e6d",
                        "error": "#ba1a1a",
                        "background": "#f7fafc",
                        "secondary": "#006a68",
                        "surface-container-high": "#e5e9eb",
                        "surface-dim": "#d7dadc",
                        "inverse-surface": "#2d3133",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#00504e",
                        "tertiary-fixed": "#d9e3f9",
                        "secondary-fixed": "#94f2f0",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface": "#181c1e",
                        "secondary-fixed-dim": "#77d6d3",
                        "tertiary-container": "#2c3647",
                        "on-primary-fixed-variant": "#2d476f",
                        "surface-tint": "#455f88",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#d6e3ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "stack-md": "24px",
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "unit": "8px",
                        "stack-xs": "4px",
                        "container-max": "1280px",
                        "stack-lg": "48px",
                        "stack-sm": "12px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "headline-md": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background: radial-gradient(circle at top right, #f1f4f6 0%, #f7fafc 100%);
        }
        .login-card {
            box-shadow: 0 20px 40px -10px rgba(26, 54, 93, 0.06);
        }
        .input-focus-ring:focus {
            outline: none;
            border-color: #006a68;
            box-shadow: 0 0 0 2px rgba(0, 106, 104, 0.1);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile">
<!-- Main Content Canvas -->
<main class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Brand Identity Header -->
<div class="flex flex-col items-center mb-stack-lg text-center">
<div class="mb-stack-sm flex items-center justify-center bg-primary p-3 rounded-xl">
<span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="lock">lock</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-2">Sign in to SecureBank</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access your secure vault.</p>
</div>
<!-- Login Card -->
<div class="login-card bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-8 md:p-10">
<!-- Flask Error Message Integration -->
            {% if error %}
            <div class="error bg-error-container text-on-error-container p-stack-sm rounded-lg flex items-center gap-stack-xs mb-stack-md animate-pulse">
<span class="material-symbols-outlined text-[20px]" data-icon="error">error</span>
<span class="font-label-md text-label-md">{{ error }}</span>
</div>
            {% endif %}

            <form action="/login" class="flex flex-col gap-stack-md" method="POST">
<!-- Username Field -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="username">Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors" data-icon="person">person</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface rounded-lg border border-outline-variant font-body-md text-body-md text-on-surface placeholder:text-outline-variant input-focus-ring transition-all" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors" data-icon="key">key</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface rounded-lg border border-outline-variant font-body-md text-body-md text-on-surface placeholder:text-outline-variant input-focus-ring transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2 px-1">
<input class="w-4 h-4 rounded-sm border-outline-variant text-secondary focus:ring-secondary cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-primary text-on-primary font-title-lg text-title-lg rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-stack-xs shadow-lg shadow-primary/10" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Bottom Navigation/Sign-up -->
<div class="mt-stack-lg pt-stack-md border-t border-outline-variant/30 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-secondary font-bold hover:underline transition-all" href="/register">Open an Account</a>
</p>
</div>
</div>
<!-- Footer Elements -->
<footer class="mt-stack-lg flex flex-col md:flex-row justify-center items-center gap-gutter text-on-surface-variant/60 font-label-sm text-label-sm">
<div class="flex items-center gap-stack-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="shield" style="font-variation-settings: 'FILL' 1;">shield</span>
<span>End-to-end 256-bit encryption</span>
</div>
<div class="hidden md:block w-1 h-1 bg-outline-variant rounded-full"></div>
<div class="flex items-center gap-stack-xs">
<span>© 2024 SecureBank. Institutional Grade Security.</span>
</div>
</footer>
</main>
<!-- Background Decorative Element -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-5%] w-[400px] h-[400px] bg-secondary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[300px] h-[300px] bg-primary/5 rounded-full blur-[80px]"></div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
                eyeIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
                eyeIcon.setAttribute('data-icon', 'visibility');
            }
        }

        // Simple animation trigger for button press
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('mousedown', () => {
            loginBtn.style.transform = 'scale(0.98)';
        });
        loginBtn.addEventListener('mouseup', () => {
            loginBtn.style.transform = 'scale(1)';
        });
    </script>
</body></html>
